<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f1ebde" />
  <title>Ballpoint · Motion Study</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="手绘角色交互画布。点击角色，再点击空格移动；也可以拖动。方向键移动光标，Enter 选中或移动，Escape 取消。"></canvas>
  <div id="paper-ui">
  <header>
    <p class="eyebrow">UI LAB <span>01 / BALLPOINT</span></p>
    <h1>motion study<span class="title-dot">.</span></h1>
  </header>
  <nav class="study-navigation" aria-label="study pages">
    <a id="nav-gallery" href="/lab.html">gallery</a>
    <a id="nav-characters" href="/components.html">character lab</a>
    <a id="nav-bio" href="/experiments/bio/block.html">bio lab</a>
  </nav>
  <div id="loading" role="status">drawing…</div>
  <aside class="specimen" aria-label="选中角色信息">
    <p class="eyebrow">THE CAST / <span id="cast-number">12</span></p>
    <h2 id="cast-name">select a character</h2>
    <p id="cast-detail"></p>
    <div class="ink-rule"></div>
    <dl>
      <div><dt>motion</dt><dd id="motion-name">idle</dd></div>
      <div><dt>parts</dt><dd id="part-count">—</dd></div>
      <div><dt>frame rate</dt><dd id="fps">— fps</dd></div>
    </dl>
  </aside>
  <footer>
    <div class="toolbar" aria-label="角色动作">
      <button id="celebrate" type="button" title="庆祝 · C"><span>✧</span> 庆祝</button>
      <button id="nap" type="button" title="睡觉或唤醒 · Z"><span>z<span class="small-z">z</span></span> 打个盹</button>
      <button id="gag" type="button" title="小把戏 · G"><span>↝</span> 小把戏</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="undo" type="button" title="撤销 · U" disabled><span>↶</span> 撤销</button>
      <button id="reset" type="button" title="重新开始 · N"><span>⟳</span> 重画</button>
      <button id="replay" type="button" aria-label="重播绘制"><span>✎</span> 绘制开场</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="sound" type="button" aria-pressed="true" title="合成轻音效 · M"><span>♪</span> 声音开</button>
      <button id="reduced" type="button" aria-pressed="false" title="减少动作幅度"><span>≈</span> 轻柔</button>
    </div>
    <p class="instructions">hover <i>·</i> click or drag to move <i>·</i> <kbd>Esc</kbd> to release</p>
    <p class="credit">Local study of <a href="https://ballpoint-gambit.vercel.app/" target="_blank" rel="noreferrer">Ballpoint Gambit ↗</a> <span>art & motion from the original public client</span></p>
  </footer>
  </div>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
